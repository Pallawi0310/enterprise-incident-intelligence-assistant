[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-incident-intelligence-assistant"
version = "0.1.0"
description = "A TF-IDF and cosine similarity based incident retrieval assistant."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.5,<2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0"
]

[tool.setuptools.packages.find]
include = ["incident_intelligence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
